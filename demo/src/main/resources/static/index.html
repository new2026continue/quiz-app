<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页</title>
  <link href="./src/styles/main.css" rel="stylesheet">
</head>
<body>

  <div class="log-book" id="logBook" >
 <header class="log-book__header">
      <span class="log-book__header-userInfo" id="logBookLogo" >
        <span class="log-book__userInfo-avatar">
          <img src="./images/tree.png" alt="logo" width="100%" height="100%">
        </span>
        
        <span class="log-book__userInfo-username">仅浏览, <a href="auth.html">去登录</a>
        </span>
      </span>
      
      <div class="log-book__header-controls">
        <button id="logoutBtn">
          
        </button>
       
      </div>
    </header>
      
   <main class="log-book__main">
      <!-- RecordView 的挂载容器 -->
      <div class="log-book__content container">
        
      </div>

      <!-- 控件区 -->
      <div class="log-book__controls controls"> 
        <div class="controls__btn-wrapper">
          <button id="toggleAutoBtn" aria-pressed="false" class="controls__toggle-btn"></button>
          <span id="autoToggleBtnText">自动</span>
        </div>
        <div class="controls__btn-wrapper">     
          <button id="addBtn"></button>   
          <span id="addBtnText">添加</span>
        </div>
        <div class="controls__btn-wrapper">     
          <button id="deleteCurrentBtn"></button>   
          <span id="deleteCurrentBtnText">删除</span>
        </div>
        <div class="controls__btn-wrapper">     
          <button id="editCurrentBtn"></button>   
          <span id="editCurrentBtnText">编辑</span>
        </div>
        <div class="controls__btn-wrapper">     
          <button id="nextBtn" ></button>
          <span id="nextBtnText">切换</span>
        </div>

        <select id="bankSelect" class="controls__bank-select">
          <option></option>

        </select>
        
        <label>
          切换<input type="number" id="intervalInput" step="1" />s/次
        </label>
        <label>
        第 <input type="number"  id="jumpInput" /> 条记录
        </label>    
      </div>
    </main>
    <!-- RecordView 的模板 -->
    <template id="record-template">
      <article class="record">
        <h3 class="record__question"></h3>
        <span class="record__answer"></span>
        <p class="record__description"></p>
      </article>
    </template>

    <template id="recordEditorTemplate">
      <h2 id="recordEditorTitle" style="text-align: center;margin-block-end: 0.5rem;"></h2>
      <form class="record-editor__form">
        <label>题库 (自动添加) <input name="bankName" value="english" required id="bankNameInput"></label>
        <label>问题 <input name="question" required id="questionInput"></label>
        <label>答案（以;分隔）
          <textarea name="answers" id="answersInput">

          </textarea>
        </label>
        <label>描述 
          <textarea name="description" id="descriptionInput" >

          </textarea>
        </label>
      
        <div class="record-editor__actions">
          <button type="submit" class="button" id="submitSaveBtn">保存</button>
          <button type="button" class="button" id="cancelSaveBtn">取消</button>
        </div>
      </form>
    </template>
  </div>
<!-- form.reset() -->
  <!-- 唯一入口：type="module" 必须写，否则 import 不生效 -->
  <script type="module" src="./src/main.js"></script>

</body>
</html>
