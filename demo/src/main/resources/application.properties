server.port=8080

# 将 sslMode=VERIFY_CA 改为 sslMode=REQUIRED，并删除证书相关配置
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED&serverTimezone=Asia/Shanghai&characterEncoding=utf8
spring.datasource.username=${DB_USER:avnadmin}
spring.datasource.password=${DB_PASSWORD:你的Aiven密码}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver